name: CI/CD.
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "Images/**"
      - "docs/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ------------------------
      # Step 1: Checkout source
      # ------------------------
      - name: Checkout source
        uses: actions/checkout@v3

      # ------------------------
      # Step 2: Set up Python
      # ------------------------
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # ------------------------
      # Step 3: Install dependencies
      # ------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ========================
      # CI SECTION STARTS HERE
      # ========================

      # ------------------------
      # Step 4: Lint (flake8)
      # ------------------------
      - name: Run flake8 (linting)
        run: |
          flake8 src

      # ------------------------
      # Step 5: Unit tests (pytest)
      # ------------------------
      - name: Run pytest
        run: |
          pytest -v

      # ------------------------
      # Step 6: Security scan (pip-audit)
      # ------------------------
      - name: Dependency security scan (informational)
        run: |
          echo " Running pip-audit (informational)..."
          python -m pip_audit || true
          echo " Security scan completed"

      # ========================
      # CD SECTION STARTS HERE
      # (only if CI passed)
      # ========================

      # ------------------------
      # Step 7: Configure AWS credentials
      # ------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: "us-east-1"

      # ------------------------
      # Step 8: Login to Amazon ECR
      # ------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # ------------------------
      # Step 9: Build, tag, and push Docker image
      # ------------------------
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          docker build -t $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # ------------------------
      # Step 10: Render ECS task definition
      # ------------------------
      - name: Fill in the new image ID in the ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: mlpanelcontainer
          image: ${{ steps.build-image.outputs.image }}

      # ------------------------
      # Step 11: Deploy to ECS
      # ------------------------
      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ secrets.ECS_SERVICE }}
          cluster: ${{ secrets.ECS_CLUSTER }}
          wait-for-service-stability: true
